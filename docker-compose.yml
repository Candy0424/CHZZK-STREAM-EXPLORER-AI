services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: livescope
      POSTGRES_DB: livescope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally before starting Docker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - livescope-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livescope -d livescope"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  livescope-postgres:
