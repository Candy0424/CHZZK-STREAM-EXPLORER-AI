name: Sync official live catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: official-live-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.LIVESCOPE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO_MODE: "false"
      CHZZK_CLIENT_ID: ${{ secrets.CHZZK_CLIENT_ID }}
      CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync
